aid: devo
name: Devo
description: >-
  Devo is a cloud-native security data platform delivering unified SIEM, security
  analytics, and threat detection at petabyte scale, powered by its HyperStream
  data engine for real-time ingestion and analytics. Devo exposes a public REST
  API surface for programmatic access to the platform: a Query API for running
  synchronous and asynchronous (job) queries against ingested data, an Alerts API
  for managing alert definitions and alert instances, plus Activeboards, Lookups,
  Provisioning, and Relay APIs. Authentication uses domain API key and secret
  credentials (HMAC-SHA256 request signing via x-logtrust-apikey / -timestamp /
  -sign headers) or standalone Bearer tokens. First-party SDKs are published for
  Python, Node.js, and the browser, alongside a Grafana datasource, a Fluentd
  plugin, an ML Model Manager client, and a JavaScript application-builder
  framework. Regional API endpoints are provided for the US (apiv2-us.devo.com)
  and EU (apiv2-eu.devo.com).
