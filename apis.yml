apis:
- name: Devo Query API
  description: >-
    Run queries against data ingested into Devo. Supports synchronous JSON/CSV/TSV
    responses and asynchronous job-based delivery to repositories (HDFS, Amazon S3,
    Kafka). Job requests start, stop, check status of, and delete running queries.
  humanURL: https://docs.devo.com/space/latest/95128275/Query+API
  baseURL: https://apiv2-us.devo.com
  properties:
  - type: Documentation
    url: https://docs.devo.com/space/latest/95128301/Running+queries+with+the+Query+API
  - type: Authentication
    url: authentication/devo-authentication.yml
- name: Devo Alerts API
  description: >-
    Create, read, update, delete, and manage Devo alert definitions and alert
    instances programmatically.
  humanURL: https://docs.devo.com/space/latest/95128644
  baseURL: https://api-us.devo.com/alerts
- name: Devo Activeboards API
  description: >-
    Programmatic management of Devo Activeboards (dashboards) — list, retrieve,
    and administer board definitions.
  humanURL: https://docs.devo.com/space/latest/95128251/API+reference
  baseURL: https://api-us.devo.com
- name: Devo Lookups API
  description: >-
    Manage lookup tables used to enrich queries and correlate data within the
    Devo platform.
  humanURL: https://docs.devo.com/space/latest/95128251/API+reference
  baseURL: https://api-us.devo.com
- name: Devo Provisioning API
  description: >-
    Administrative provisioning of Devo domains, users, and platform resources.
  humanURL: https://docs.devo.com/space/latest/95128251/API+reference
  baseURL: https://api-us.devo.com
- name: Devo Relay API
  description: >-
    Manage Devo Relay configuration for secure data forwarding into the platform.
  humanURL: https://docs.devo.com/space/latest/95128251/API+reference
  baseURL: https://api-us.devo.com
